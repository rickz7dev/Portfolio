<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Henrique | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header class="profile">
      <!-- Para usar sua foto: troque o conteúdo da div por <img src="sua-foto.jpg" alt="Isac" /> -->
      <div class="avatar"><span>H</span></div>

      <div class="info">
        <h1>Henrique</h1>
        <p class="handle">@rickz</p>
        <p class="status"><span class="dot"></span> Disponível para projetos</p>
      </div>

      <button class="theme-btn" id="themeBtn" aria-label="Alternar tema">
        <i class="ri-moon-line" id="themeIcon"></i>
      </button>
    </header>

    <p class="bio">Estudante, desenvolvedor e criador. Aqui estão meus links principais.</p>

    <nav class="links">
      <a href="" target="_blank" rel="noopener" style="--i:0">
        <span class="num">01</span>
        <span class="label">Meu portfólio</span>
        <i class="ri-arrow-right-up-line"></i>
      </a>
      <a href="" target="_blank" rel="noopener" style="--i:1">
        <span class="num">02</span>
        <span class="label">Baixar meu e-book</span>
        <i class="ri-arrow-right-up-line"></i>
      </a>
      <a href="" target="_blank" rel="noopener" style="--i:2">
        <span class="num">03</span>
        <span class="label">Ver meus projetos</span>
        <i class="ri-arrow-right-up-line"></i>
      </a>
      <a href="https://wa.me/91980450041" target="_blank" rel="noopener" style="--i:3">
        <span class="num">04</span>
        <span class="label">Fale comigo no WhatsApp</span>
        <i class="ri-arrow-right-up-line"></i>
      </a>
    </nav>

    <div class="socials">
      <a href="https://github.com/rickz7dev" target="_blank" rel="noopener" aria-label="GitHub"><i class="ri-github-fill"></i></a>
      <a href="https://instagram.com/henriqdc_" target="_blank" rel="noopener" aria-label="Instagram"><i class="ri-instagram-line"></i></a>
      <a href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube"><i class="ri-youtube-fill"></i></a>
      <a href="https://linkedin.com/in" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="ri-linkedin-box-fill"></i></a>
    </div>

    <footer>
      <p>Feito por Henrique · <span id="year"></span></p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
